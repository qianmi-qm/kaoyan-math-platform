server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kaoyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 1s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: order

app:
  jwt:
    # 生产必须用环境变量覆盖；至少 32 字节
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef0123456789abcdef}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  demo-user:
    # 本地演示账号 learner / learner123；生产设 DEMO_USER_ENABLED=false
    enabled: ${DEMO_USER_ENABLED:true}
    password: ${DEMO_USER_PASSWORD:learner123}
  cache:
    report:
      enabled: ${REPORT_CACHE_ENABLED:true}
      # 25 小时，避免跨天前失效；实际写入时再加随机抖动
      ttl-seconds: 90000
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    # 为空时直接降级为参考解析，不发起网络请求
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: 60
    max-context-chars: 4000
