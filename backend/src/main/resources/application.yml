server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kaoyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 1s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: order

app:
  jwt:
    # 必须由环境变量提供；无默认值，缺失时应用启动失败
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:2}
    refresh-expire-days: ${JWT_REFRESH_DAYS:7}
  demo-user:
    # 默认关闭；本地演示需显式开启并设置非默认密码
    enabled: ${DEMO_USER_ENABLED:false}
    password: ${DEMO_USER_PASSWORD:}
  admin-user:
    # 独立管理员引导；生产必须配置密码（ADMIN_REQUIRED=true 时缺失会启动失败）
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    required: ${ADMIN_REQUIRED:true}
  cache:
    report:
      enabled: ${REPORT_CACHE_ENABLED:true}
      # 25 小时，避免跨天前失效；实际写入时再加随机抖动
      ttl-seconds: 90000
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    # 为空时直接降级为参考解析，不发起网络请求
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: 60
    max-context-chars: 4000
    daily-quota: ${AI_DAILY_QUOTA:20}
